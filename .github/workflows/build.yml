name: build-exe

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Build onefile exe
        run: |
          pip install pyinstaller
          pyinstaller --onefile --name MacPlan --console --clean macplan/__main__.py

      - name: Smoke test
        run: dist/MacPlan.exe --help

      - uses: actions/upload-artifact@v4
        with:
          name: MacPlan-windows
          path: dist/MacPlan.exe

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/MacPlan.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
